services:
  zarela-webapp:
    container_name: zarela-webapp
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_ZARELA_CONTRACT_ADDRESS=${REACT_APP_ZARELA_CONTRACT_ADDRESS}
        - REACT_APP_ETHERSCAN_MAINNET_API_LINK=${REACT_APP_ETHERSCAN_MAINNET_API_LINK}
        - REACT_APP_ETHEREUM_API_KEY=${REACT_APP_ETHEREUM_API_KEY}
        - REACT_APP_IPFS=${REACT_APP_IPFS}
        - REACT_APP_IPFS_GET_LINK=${REACT_APP_IPFS_GET_LINK}
        - REACT_APP_PINATA_JWT=${REACT_APP_PINATA_JWT}
        - REACT_APP_ETHERSCAN_LINK=${REACT_APP_ETHERSCAN_LINK:-https://etherscan.io/tx/}
        - REACT_APP_ZARELA_BUSINESS_CATEGORY=${REACT_APP_ZARELA_BUSINESS_CATEGORY:-1}
        - REACT_APP_EXPLORE_LINK=${REACT_APP_EXPLORE_LINK}
        - DISABLE_ESLINT_PLUGIN=true
    image: zarela-webapp:latest
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - zarela-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zarela-network:
    driver: bridge
    name: zarela-network
